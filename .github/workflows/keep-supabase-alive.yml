name: Keep Supabase project alive

on:
  schedule:
    - cron: '0 6 */4 * *'  # every 4 days at 06:00 UTC — Supabase free tier pauses after ~7 days idle
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sf "https://aqtfbzrdwbdymaoskxpt.supabase.co/rest/v1/visits?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
